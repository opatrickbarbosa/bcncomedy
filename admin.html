<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>BCN Comedy · Gestão</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function(){try{var t=localStorage.getItem("bcn-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}})();
</script>
<style>
:root{
  --bg:#f5f5f2;--panel:#ffffff;--panel2:#fafaf8;--line:#e3e3de;--line2:#d4d4ce;
  --text:#151515;--muted:#6a6a64;--faint:#9a9a93;
  --accent:#ECC122;--accent-ink:#151515;--accent-text:#8a6a00;--accent-soft:#fbf1cc;
  --danger:#c8240d;--danger-soft:#fde7e3;--ok:#23824a;--ok-soft:#e1f3e7;
  --track:#ecece7;--shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1011;--panel:#17181a;--panel2:#1c1d20;--line:#2a2c2f;--line2:#36383c;
  --text:#f1f1ee;--muted:#a2a29c;--faint:#6f6f6a;
  --accent:#ECC122;--accent-ink:#151515;--accent-text:#ECC122;--accent-soft:#3a3218;
  --danger:#ff6a52;--danger-soft:#3b1a14;--ok:#7fd49a;--ok-soft:#183226;
  --track:#26282b;--shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1011;--panel:#17181a;--panel2:#1c1d20;--line:#2a2c2f;--line2:#36383c;
  --text:#f1f1ee;--muted:#a2a29c;--faint:#6f6f6a;
  --accent:#ECC122;--accent-ink:#151515;--accent-text:#ECC122;--accent-soft:#3a3218;
  --danger:#ff6a52;--danger-soft:#3b1a14;--ok:#7fd49a;--ok-soft:#183226;
  --track:#26282b;--shadow:none;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased}
a{color:var(--accent-text)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:17px}h3{font-size:14px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1}.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:var(--danger)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.chip.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:16px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{width:100%;height:36px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);outline:none}
textarea{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
label.f>span{display:block;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.bar{height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.done>i{background:var(--ok)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.tablewrap{overflow-x:auto}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth .card{width:100%;max-width:380px;padding:28px}
.logo{display:inline-flex;align-items:center;flex:0 0 auto;cursor:pointer;border:0;background:none;padding:0}
.logo img{height:36px;width:auto;display:block}
.logo .l-light{display:none}
:root[data-theme="dark"] .logo .l-light{display:block}:root[data-theme="dark"] .logo .l-ink{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .l-light{display:block}:root:not([data-theme="light"]) .logo .l-ink{display:none}}
.auth .logo img{height:64px}
.auth h1{margin:18px 0 4px}
.auth form{display:grid;gap:12px;margin-top:18px}
.msg{font-size:13px;padding:8px 10px;border-radius:8px}
.msg.err{background:var(--danger-soft);color:var(--danger)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
/* shell */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{height:32px;padding:0 12px;border:0;background:transparent;border-radius:8px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
.nav button:hover{color:var(--text);background:var(--panel2)}
.nav button.on{color:var(--text);background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.main{max-width:1280px;margin:0 auto;padding:20px 20px 80px}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
/* timeline */
.tl{position:relative;display:flex;gap:14px;overflow-x:auto;padding:30px 2px 14px;scroll-snap-type:x proximity;scrollbar-width:thin}
.tl-axis{position:absolute;left:0;top:14px;height:1px;background:var(--line2)}
.tl-today{position:relative;flex:0 0 28px;scroll-snap-align:start;display:flex;justify-content:center}
.tl-today:before{content:"";width:2px;border-radius:2px;background:var(--accent)}
.tl-today span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:600;color:var(--accent-text);white-space:nowrap}
.sc{flex:0 0 248px;scroll-snap-align:start;cursor:pointer;padding:14px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.sc:hover{border-color:var(--faint)}
.sc.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sc.past{opacity:.6}
.sc-date b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sc-date span{display:block;margin-top:2px}
.sc-title{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-rows{display:grid;gap:7px}
.sc-row{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:8px;font-size:12.5px}
.sc-row em{font-style:normal;color:var(--faint);text-align:right;font-size:11.5px}
.sc-foot{display:flex;gap:6px;flex-wrap:wrap}
.tl-add{flex:0 0 140px;display:grid;place-items:center;border:1px dashed var(--line2);border-radius:12px;color:var(--muted);cursor:pointer;background:transparent}
.tl-add:hover{color:var(--text);border-color:var(--faint)}
/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto}
.day{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:150px;display:flex;flex-direction:column}
.day.today{border-color:var(--accent)}
.day-h{padding:10px 12px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;display:flex;justify-content:space-between}
.day-b{padding:8px;display:grid;gap:6px;align-content:start}
.task{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;background:var(--panel2);font-size:12.5px;line-height:1.35}
.task input{margin:2px 0 0;accent-color:var(--ok);width:15px;height:15px;flex:0 0 auto;cursor:pointer}
.task .t-sub{display:block;color:var(--faint);font-size:11.5px;margin-top:2px}
.task.done .t-main{text-decoration:line-through;color:var(--faint)}
.task.late{background:var(--danger-soft)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
/* event */
.ev-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:20px 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 12px;color:var(--muted);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs button .chip{margin-left:6px;height:18px;padding:0 6px;font-size:11px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.list{display:grid;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px}
.kpi b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.sectors{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.sector{padding:12px;cursor:pointer}
.sector:hover{border-color:var(--faint)}
.empty{padding:18px;text-align:center;color:var(--faint);font-size:13px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:20px}
.modal form{display:grid;gap:12px;margin-top:14px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:60}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
@media (max-width:760px){
  .top-in{padding:10px 14px;gap:10px;flex-wrap:wrap}
  .top-in .nav{order:3;width:100%}
  .main{padding:14px 14px 80px}
  .cols,.grid2{grid-template-columns:1fr}
  .sc{flex-basis:78vw}
  .week{grid-template-columns:repeat(7,78vw);scroll-snap-type:x mandatory}
  .day{scroll-snap-align:start}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div id="app"><div class="loading">Carregando...</div></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://ootfzgsoreeicehgbucc.supabase.co";
const SUPABASE_KEY = "sb_publishable_xGA5ESfmSrY9N0PAVFDxPA_cEfaUNhN";
const PARTNERS = ["Patrick", "Max"];
const SHARE = { Patrick: .5, Max: .5 };

// read the auth callback type before the client consumes the URL hash
const HASH = new URLSearchParams(location.hash.slice(1));
let AUTH_TYPE = HASH.get("type");            // invite | recovery | signup | magiclink
const AUTH_ERR = HASH.get("error_description");

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, detectSessionInUrl: true } });

/* ---------------- i18n ---------------- */
let LANG = localStorage.getItem("bcn-lang") || ((navigator.language || "").startsWith("pt") ? "pt" : "en");
const L = (pt, en) => LANG === "en" ? en : pt;
const SECTORS = [
  ["Show", "Show", "Show", "#ECC122"],
  ["Instagram", "Instagram", "Instagram", "#d4569b"],
  ["Anuncios", "Anúncios", "Ads", "#4c7bd9"],
  ["Cupons", "Cupons", "Coupons", "#2f9e8f"],
  ["Ingressos", "Ingressos", "Tickets", "#8a63d2"],
  ["Financeiro", "Financeiro", "Finance", "#5f8f3a"],
];
const SECTOR_NAME = k => { const s = SECTORS.find(x => x[0] === k); return s ? L(s[1], s[2]) : (k === "Patrocinio" ? L("Patrocínio", "Sponsor") : (k || "")); };
const SECTOR_COLOR = k => (SECTORS.find(x => x[0] === k) || [0, 0, 0, "#9a9a93"])[3];
const TASK_EN = { lineup: "Lock the lineup (3 guests)", eb: "Create the Eventbrite event", flyer: "Flyer ready", sales: "Open sales on the site", ig_date: "Date post", coupons: "Comedian coupons sent", ad_create: "Create Facebook/Instagram ad", ad_live: "Ad running", ig_lineup: "Lineup post", st3: "Stories D-3 with ticket link", st1: "Stories D-1 with ticket link", st0: "Stories on the day", cash: "Close the night's cash", ad_report: "Ad report", pay: "Pay the comedians", clips: "Post show clips", chandrio: "Send the month's flyers to Chandrío" };
const taskTitle = t => LANG === "en" && TASK_EN[t.template_key] ? TASK_EN[t.template_key] + (t.template_key === "chandrio" ? " (" + String(t.id).split(":")[1] + ")" : "") : t.title;

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const pd = s => { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const fdate = (s, o) => s ? new Intl.DateTimeFormat(LANG === "en" ? "en-GB" : "pt-BR", o || { weekday: "short", day: "numeric", month: "short" }).format(pd(s)).replace(/\./g, "") : "";
const eur = v => new Intl.NumberFormat(LANG === "en" ? "en-GB" : "pt-BR", { style: "currency", currency: "EUR" }).format(num(v));
const daysTo = s => Math.round((pd(s) - pd(today())) / 864e5);
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/-/g, "").slice(0, 12);

/* ---------------- state ---------------- */
const TABLES = ["shows", "tasks", "lineup", "comedians", "coupons", "ads", "expenses", "payments", "instagram", "orders", "signups", "settings", "profiles"];
let S = Object.fromEntries(TABLES.map(t => [t, []]));
let ME = null, PROFILE = null;
let R = { view: "home", showId: null, tab: "overview", weekStart: null, mine: false };

async function loadAll() {
  const res = await Promise.all(TABLES.map(t => sb.from(t).select("*")));
  res.forEach((r, i) => { if (r.error) throw r.error; S[TABLES[i]] = r.data || []; });
}
async function save(table, row) {
  const { data, error } = await sb.from(table).upsert(row).select().single();
  if (error) { toast(L("Erro ao salvar: ", "Save error: ") + error.message); throw error; }
  const key = table === "settings" ? "key" : "id";
  const i = S[table].findIndex(x => x[key] === data[key]);
  if (i >= 0) S[table][i] = data; else S[table].push(data);
  return data;
}
async function del(table, id) {
  const { error } = await sb.from(table).delete().eq("id", id);
  if (error) { toast(error.message); throw error; }
  S[table] = S[table].filter(x => x.id !== id);
}
function logAct(action, detail) { sb.from("activity_log").insert({ action, detail }).then(() => {}); }

/* ---------------- derived ---------------- */
const shows = () => S.shows.slice().sort((a, b) => a.date.localeCompare(b.date));
const showById = id => S.shows.find(s => s.id === id);
const tasksOf = id => S.tasks.filter(t => t.show_id === id).sort((a, b) => (a.due || "").localeCompare(b.due || ""));
const lineupOf = id => S.lineup.filter(l => l.show_id === id);
const booked = l => /confirm|paid|pago/i.test(l.payment || "");
const income = s => num(s.cash_tickets) * num(s.cash_price) + num(s.bizum_tickets) * num(s.bizum_price) + num(s.eb_net);
const fees = s => num(s.headliners) * num(s.headliner_fee) + num(s.guests) * num(s.guest_fee);
const sponsorIn = s => s.sponsor_paid ? num(s.sponsor) : 0;
const net = s => income(s) + sponsorIn(s) - fees(s);
const tickets = s => num(s.eb_tickets) + num(s.cash_tickets) + num(s.bizum_tickets) + num(s.free_tickets);
const template = () => (S.settings.find(x => x.key === "task_template") || {}).value || [];
const nextShow = () => shows().find(s => s.date >= today() && s.status !== "cancelled");
function progress(showId, sector) {
  const ts = tasksOf(showId).filter(t => !sector || t.sector === sector);
  return { done: ts.filter(t => t.done).length, total: ts.length };
}
function finance() {
  const P = {}; PARTNERS.forEach(p => P[p] = { paid: 0, kept: 0, held: 0, out: 0, in: 0 });
  let shared = 0, profit = 0;
  S.expenses.forEach(e => { const a = num(e.amount); if (P[e.paid_by]) P[e.paid_by].paid += a; if (P[e.keeper]) P[e.keeper].kept += a; else shared += a; });
  shows().forEach(s => { if (s.date > today() && !income(s)) return; const n = net(s); if (P[s.held_by]) { P[s.held_by].held += n; profit += n; } });
  S.payments.forEach(t => { const a = num(t.amount); if (P[t.from_person]) P[t.from_person].out += a; if (P[t.to_person]) P[t.to_person].in += a; });
  PARTNERS.forEach(p => { const x = P[p]; x.bal = x.paid - x.kept - shared * SHARE[p] + (profit * SHARE[p] - x.held) + x.out - x.in; });
  const pending = shows().filter(s => s.date <= today() && s.status !== "cancelled").reduce((a, s) => a + (s.sponsor_paid ? 0 : num(s.sponsor)), 0);
  const totIncome = shows().reduce((a, s) => a + income(s) + sponsorIn(s), 0), totFees = shows().reduce((a, s) => a + fees(s), 0), totExp = S.expenses.reduce((a, e) => a + num(e.amount), 0);
  return { P, shared, profit, pending, totIncome, totFees, totExp };
}

/* ---------------- auth screens ---------------- */
const LOGO = `<span class="logo"><img class="l-ink" src="/assets/bcn-logo-ink.webp" alt="BCN Comedy"><img class="l-light" src="/assets/bcn-logo-s.webp" alt="BCN Comedy"></span>`;
function authShell(inner) {
  return `<div class="auth"><div class="card">${LOGO}${inner}</div></div>`;
}
function viewLogin(note) {
  $("#app").innerHTML = authShell(`
    <h1>${L("Entrar", "Sign in")}</h1>
    <p class="muted small">${L("Painel de gestão interno", "Internal management hub")}</p>
    <form id="f">
      ${note ? `<div class="msg ${note.ok ? "ok" : "err"}">${esc(note.text)}</div>` : ""}
      <label class="f"><span>E-mail</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="f"><span>${L("Senha", "Password")}</span><input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn primary" style="justify-content:center">${L("Entrar", "Sign in")}</button>
      <button type="button" class="btn ghost" id="forgot" style="justify-content:center">${L("Esqueci a senha", "Forgot password")}</button>
    </form>
    <div class="row" style="margin-top:14px;justify-content:center">${langBtn()}</div>`);
  $("#f").onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target), b = e.target.querySelector(".primary"); b.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: f.get("email").trim(), password: f.get("password") });
    if (error) { b.disabled = false; viewLogin({ text: /invalid/i.test(error.message) ? L("E-mail ou senha incorretos.", "Wrong e-mail or password.") : error.message }); }
  };
  $("#forgot").onclick = viewForgot; wireLang();
}
function viewForgot() {
  $("#app").innerHTML = authShell(`
    <h1>${L("Redefinir senha", "Reset password")}</h1>
    <p class="muted small">${L("Enviamos um link para o seu e-mail.", "We will e-mail you a link.")}</p>
    <form id="f">

function taskItem(t, opts = {}) {
  const late = !t.done && t.due && t.due < today();
  const s = t.show_id ? showById(t.show_id) : null;
  const sub = [opts.showName && s ? fdate(s.date, { day: "numeric", month: "short" }) : "", opts.sector ? SECTOR_NAME(t.sector) : "", opts.due && t.due ? fdate(t.due) : "", t.owner || ""].filter(Boolean).join(" · ");
  return `<div class="task ${t.done ? "done" : ""} ${late ? "late" : ""}">
    <input type="checkbox" data-task="${esc(t.id)}" ${t.done ? "checked" : ""} aria-label="${esc(taskTitle(t))}">
    <div class="grow"><span class="t-main"><span class="dot" style="background:${SECTOR_COLOR(t.sector)}"></span>${esc(taskTitle(t))}</span>${sub ? `<span class="t-sub">${esc(sub)}</span>` : ""}</div>
    ${opts.edit ? `<button class="btn ghost sm" data-edit-task="${esc(t.id)}">${L("Editar", "Edit")}</button>` : ""}
  </div>`;
}
function wireCommon() {
  document.querySelectorAll("[data-task]").forEach(c => c.onchange = async () => {
    const t = S.tasks.find(x => x.id === c.dataset.task); if (!t) return;
    await save("tasks", { ...t, done: c.checked, done_at: c.checked ? new Date().toISOString() : null });
    logAct(c.checked ? "task_done" : "task_reopened", { id: t.id, by: PROFILE?.name }); render();
  });
  document.querySelectorAll("[data-edit-task]").forEach(b => b.onclick = () => editTask(S.tasks.find(x => x.id === b.dataset.editTask)));
}
function modal(title, fields, row, onSave, extra) {
  const ov = document.createElement("div"); ov.className = "ov";
  ov.innerHTML = `<div class="card modal"><h2>${esc(title)}</h2><form id="mf">
    <div class="grid2">${fields.map(f => field(f, row?.[f.k])).join("")}</div>
    <div id="merr"></div>
    <div class="acts">${extra ? `<button type="button" class="btn danger" id="mdel" style="margin-right:auto">${L("Excluir", "Delete")}</button>` : ""}<button type="button" class="btn" id="mcancel">${L("Cancelar", "Cancel")}</button><button class="btn primary">${L("Salvar", "Save")}</button></div>
  </form></div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.onclick = e => { if (e.target === ov) close(); };
  ov.querySelector("#mcancel").onclick = close;
  if (extra) ov.querySelector("#mdel").onclick = async () => { if (confirm(L("Excluir este item?", "Delete this item?"))) { await extra(); close(); render(); } };
  ov.querySelector("#mf").onsubmit = async e => {
    e.preventDefault(); const fd = new FormData(e.target), out = { ...(row || {}) };
    fields.forEach(f => { let v = fd.get(f.k); if (f.t === "check") v = fd.get(f.k) === "on"; else if (f.t === "number") v = v === "" ? null : num(v); else if (v === "") v = null; out[f.k] = v; });
    const b = e.target.querySelector(".primary"); b.disabled = true;
    try { await onSave(out); close(); render(); } catch (err) { b.disabled = false; ov.querySelector("#merr").innerHTML = `<div class="msg err">${esc(err.message || err)}</div>`; }
  };
  setTimeout(() => ov.querySelector("input,select,textarea")?.focus(), 30);
}
function field(f, v) {
  const cls = f.full ? "full" : "";
  if (f.t === "select") return `<label class="f ${cls}"><span>${esc(f.l)}</span><select name="${f.k}">${f.o.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(v ?? "") === String(val) ? "selected" : ""}>${esc(lab)}</option>`; }).join("")}</select></label>`;
  if (f.t === "check") return `<label class="f ${cls}" style="display:flex;align-items:center;gap:8px;height:36px;margin-top:18px"><input type="checkbox" name="${f.k}" ${v ? "checked" : ""}> ${esc(f.l)}</label>`;
  if (f.t === "area") return `<label class="f full"><span>${esc(f.l)}</span><textarea name="${f.k}">${esc(v)}</textarea></label>`;
  return `<label class="f ${cls}"><span>${esc(f.l)}</span><input type="${f.t || "text"}" name="${f.k}" value="${esc(v)}" ${f.t === "number" ? 'step="any"' : ""} ${f.req ? "required" : ""}></label>`;
}
const OWNERS = () => [["", "—"], ...S.profiles.filter(p => p.active).map(p => [p.name, p.name])];

function showCard(s, isNext) {
  const past = s.date < today();
  const lu = lineupOf(s.id), bk = lu.filter(booked).length;
  const rows = SECTORS.map(([k]) => { const p = progress(s.id, k); if (!p.total) return ""; const pct = Math.round(p.done / p.total * 100); return `<div class="sc-row"><span>${SECTOR_NAME(k)}</span><div class="bar ${pct === 100 ? "done" : ""}"><i style="width:${pct}%"></i></div><em>${p.done}/${p.total}</em></div>`; }).join("");
  const late = tasksOf(s.id).filter(t => !t.done && t.due && t.due < today()).length;
  const d = daysTo(s.date);
  return `<div class="card sc ${isNext ? "next" : ""} ${past ? "past" : ""}" data-open="${s.id}" ${isNext ? 'id="nextcard"' : ""}>
    <div><div class="sc-date"><b>${fdate(s.date, { day: "numeric", month: "short" })}</b><span class="muted small">${fdate(s.date, { weekday: "long" })} · ${esc(s.time || "")}</span></div>
    <div class="sc-title">${esc(s.title)}</div></div>
    <div class="sc-rows">${rows}</div>
    <div class="sc-foot">
      ${s.status === "cancelled" ? `<span class="chip bad">${L("Cancelado", "Cancelled")}</span>` : past ? `<span class="chip">${L("Realizado", "Done")}</span>` : d === 0 ? `<span class="chip warn">${L("Hoje", "Tonight")}</span>` : `<span class="chip">${L("em", "in")} ${d} ${L("dias", "days")}</span>`}
      <span class="chip ${bk >= 3 ? "ok" : ""}">${L("Lineup", "Lineup")} ${bk}/3</span>
      ${tickets(s) ? `<span class="chip">${tickets(s)} ${L("ingressos", "tickets")}</span>` : ""}
      ${late ? `<span class="chip bad">${late} ${L("atrasada", "late")}${late > 1 ? "s" : ""}</span>` : ""}
    </div>
  </div>`;
}
function weekStart(d) { const x = pd(d || today()); const wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return ymd(x); }
function vHome() {

  html += `<button class="tl-add" id="addshow">+ ${L("Novo show", "New show")}</button>`;

  return `

function wireHome() {

const SHOW_FIELDS = () => [

function newShow() {
  const last = shows().at(-1);
  modal(L("Novo show", "New show"), SHOW_FIELDS(), { date: last ? addDays(last.date, 7) : today(), time: "20:30", title: "Laughin American Social Club", venue: "Bar AlgoRitmo", status: "planned", sponsor: 40, headliners: 1, headliner_fee: 15, guests: 2, guest_fee: 5 }, async row => {

    row.id = "s" + uid();
    const s = await save("shows", row);
    const tasks = template().map(t => ({ id: s.id + ":" + t.key, show_id: s.id, template_key: t.key, title: t.title, sector: t.sector, due: addDays(s.date, t.offset), done: false }));

      <tr><td class="muted">${L("Itens que ficaram com ele", "Items they kept")}</td>${PARTNERS.map(p => `<td class="num">${eur(F.P[p].kept)}</td>`).join("")}</tr>
      <tr><td class="muted">${L("Dinheiro de shows com ele", "Show money held")}</td>${PARTNERS.map(p => `<td class="num">${eur(F.P[p].held)}</td>`).join("")}</tr>
      <tr><td class="muted">${L("Transferências enviadas / recebidas", "Transfers sent / received")}</td>${PARTNERS.map(p => `<td class="num">${eur(F.P[p].out)} / ${eur(F.P[p].in)}</td>`).join("")}</tr>
      <tr><td><b>${L("Saldo", "Balance")}</b></td>${PARTNERS.map(p => `<td class="num"><b>${eur(F.P[p].bal)}</b></td>`).join("")}</tr></table></div>
    <p class="faint small" style="margin:10px 0 0">${L("Divisão 50/50, sem fundo de caixa. Dinheiro do Chandrío só entra quando pago.", "50/50 split, no cash fund. Chandrío money only counts once paid.")}</p></div>
  <div class="cols sec">
    <div class="card pad"><h2 style="margin-bottom:10px">${L("Shows", "Shows")}</h2><div class="tablewrap"><table><tr><th>${L("Data", "Date")}</th><th class="num">${L("Receita", "Income")}</th><th class="num">${L("Cachês", "Fees")}</th><th class="num">${L("Resultado", "Result")}</th></tr>${past.map(s => `<tr data-open="${s.id}" style="cursor:pointer"><td>${fdate(s.date, { day: "numeric", month: "short", year: "2-digit" })}</td><td class="num">${eur(income(s) + sponsorIn(s))}</td><td class="num">${eur(fees(s))}</td><td class="num"><b>${eur(net(s))}</b></td></tr>`).join("")}</table></div></div>
    <div class="card pad"><h2 style="margin-bottom:10px">${L("Despesas", "Expenses")}</h2><div class="tablewrap"><table><tr><th>${L("Item", "Item")}</th><th>${L("Pagou", "Paid by")}</th><th class="num">${L("Valor", "Amount")}</th><th></th></tr>${exps.map(e => `<tr><td>${esc(e.item)}${e.keeper && e.keeper !== "Shared" ? `<div class="faint small">${L("Fica com ", "Kept by ")}${esc(e.keeper)}</div>` : ""}</td><td>${esc(e.paid_by || "")}</td><td class="num">${eur(e.amount)}</td><td class="num"><button class="btn ghost sm" data-exp="${e.id}">${L("Editar", "Edit")}</button></td></tr>`).join("")}</table></div>
    ${S.payments.length ? `<h3 style="margin:16px 0 8px">${L("Transferências", "Transfers")}</h3><table>${S.payments.map(p => `<tr><td>${fdate(p.date)}</td><td>${esc(p.from_person)} → ${esc(p.to_person)}</td><td class="num">${eur(p.amount)}</td><td class="num"><button class="btn ghost sm" data-paym="${p.id}">${L("Editar", "Edit")}</button></td></tr>`).join("")}</table>` : ""}</div>
  </div>`;
}
function wireFin() {
  const expF = [{ k: "item", l: "Item", full: true, req: true }, { k: "amount", l: L("Valor (€)", "Amount (€)"), t: "number", req: true }, { k: "date", l: L("Data", "Date"), t: "date" },
    { k: "paid_by", l: L("Quem pagou", "Paid by"), t: "select", o: PARTNERS }, { k: "keeper", l: L("Fica com", "Kept by"), t: "select", o: [["Shared", L("Dos dois", "Shared")], ...PARTNERS.map(p => [p, p])] },
    { k: "category", l: L("Categoria", "Category"), t: "select", o: ["Equipment", "Marketing", "Consumables", "Venue", "Other"] }, { k: "notes", l: L("Notas", "Notes"), t: "area" }];
  const payF = [{ k: "date", l: L("Data", "Date"), t: "date" }, { k: "amount", l: L("Valor (€)", "Amount (€)"), t: "number", req: true }, { k: "from_person", l: L("De", "From"), t: "select", o: PARTNERS }, { k: "to_person", l: L("Para", "To"), t: "select", o: PARTNERS.slice().reverse() }, { k: "notes", l: L("Notas", "Notes"), t: "area" }];
  $("#addexp").onclick = () => modal(L("Nova despesa", "New expense"), expF, { date: today(), paid_by: PROFILE?.name, keeper: "Shared", category: "Equipment" }, async r => { r.id = "e" + uid(); await save("expenses", r); });
  document.querySelectorAll("[data-exp]").forEach(b => b.onclick = () => { const e = S.expenses.find(x => x.id === b.dataset.exp); modal(L("Editar despesa", "Edit expense"), expF, e, r => save("expenses", r), async () => del("expenses", e.id)); });
  $("#addpay").onclick = () => modal(L("Nova transferência", "New transfer"), payF, { date: today() }, async r => { r.id = "t" + uid(); await save("payments", r); });
  document.querySelectorAll("[data-paym]").forEach(b => b.onclick = () => { const p = S.payments.find(x => x.id === b.dataset.paym); modal(L("Editar transferência", "Edit transfer"), payF, p, r => save("payments", r), async () => del("payments", p.id)); });
  document.querySelectorAll("[data-open]").forEach(c => c.onclick = () => go({ view: "show", showId: c.dataset.open, tab: "Financeiro" }));
}

/* ---------------- team ---------------- */
const ROLES = () => [["admin", "Admin"], ["producao", L("Produção", "Production")], ["social", "Social media"]];
function vTeam() {
  const isAdmin = PROFILE?.role === "admin";
  return `<div class="row wrap"><h1 class="grow">${L("Equipe", "Team")}</h1>${isAdmin ? `<button class="btn primary" id="invite">+ ${L("Convidar pessoa", "Invite someone")}</button>` : ""}</div>
  <div class="card pad sec"><div class="tablewrap"><table><tr><th>${L("Nome", "Name")}</th><th>E-mail</th><th>${L("Papel", "Role")}</th><th>Status</th><th></th></tr>
  ${S.profiles.map(p => `<tr><td><b>${esc(p.name)}</b>${p.id === ME.id ? ` <span class="chip">${L("você", "you")}</span>` : ""}</td><td>${esc(p.email)}</td><td>${esc((ROLES().find(r => r[0] === p.role) || [0, p.role])[1])}</td><td><span class="chip ${p.active ? "ok" : "bad"}">${p.active ? L("Ativo", "Active") : L("Desativado", "Disabled")}</span></td><td class="num">${isAdmin && p.id !== ME.id ? `<button class="btn ghost sm" data-prof="${p.id}">${L("Editar", "Edit")}</button>` : ""}</td></tr>`).join("")}</table></div>
  <p class="faint small" style="margin:12px 0 0">${L("O convite chega por e-mail com um link para a pessoa criar a própria senha. Comediantes não têm acesso ao painel.", "The invite arrives by e-mail with a link to create a password. Comedians have no access to the hub.")}</p></div>`;
}
function wireTeam() {
  const inv = $("#invite"); if (inv) inv.onclick = () => modal(L("Convidar pessoa", "Invite someone"), [
    { k: "name", l: L("Nome", "Name"), req: true }, { k: "email", l: "E-mail", t: "email", req: true }, { k: "role", l: L("Papel", "Role"), t: "select", o: ROLES() },
  ], { role: "admin" }, async r => {
    const { data, error } = await sb.functions.invoke("invite-user", { body: { email: r.email.trim(), name: r.name.trim(), role: r.role } });
    if (error || data?.error) throw new Error(data?.error || error.message);
    await loadAll(); toast(L("Convite enviado para ", "Invite sent to ") + r.email); logAct("user_invited", { email: r.email, by: PROFILE?.name });
  });
  document.querySelectorAll("[data-prof]").forEach(b => b.onclick = () => { const p = S.profiles.find(x => x.id === b.dataset.prof); modal(L("Editar pessoa", "Edit person"), [
    { k: "name", l: L("Nome", "Name"), req: true }, { k: "role", l: L("Papel", "Role"), t: "select", o: ROLES() }, { k: "active", l: L("Acesso ativo", "Access active"), t: "check" },
  ], p, r => save("profiles", { id: r.id, name: r.name, role: r.role, active: r.active, email: r.email, lang: r.lang })); });
}

/* ---------------- boot ---------------- */
function readHashRoute() {
  const h = location.hash.slice(1); if (!h || h.includes("access_token") || h.includes("error")) return;
  const [v, id, tab] = h.split("/");
  if (v === "show" && id) R = { ...R, view: "show", showId: id, tab: tab || "overview" }; else if (NAV.some(n => n[0] === v)) R.view = v;
}
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  ME = session?.user || null;
  if (!ME) { viewLogin(AUTH_ERR ? { text: /expired|invalid/i.test(AUTH_ERR) ? L("Este link expirou ou já foi usado. Peça um novo.", "This link has expired or was already used. Ask for a new one.") : AUTH_ERR } : null); return; }
  const { data: prof } = await sb.from("profiles").select("*").eq("id", ME.id).maybeSingle();
  PROFILE = prof;
  if (!PROFILE || !PROFILE.active) { await sb.auth.signOut(); PROFILE = null; viewLogin({ text: L("Seu acesso está desativado. Fale com um admin.", "Your access is disabled. Talk to an admin.") }); return; }
  if (AUTH_TYPE === "invite" || AUTH_TYPE === "recovery") { viewSetPassword(AUTH_TYPE === "invite"); return; }
  $("#app").innerHTML = `<div class="loading">${L("Carregando...", "Loading...")}</div>`;
  try { await loadAll(); } catch (e) { $("#app").innerHTML = `<div class="loading">${esc(e.message)}</div>`; return; }
  readHashRoute(); render();
}
sb.auth.onAuthStateChange((ev) => { if (ev === "PASSWORD_RECOVERY") { AUTH_TYPE = "recovery"; } if (ev === "SIGNED_IN" && !PROFILE) setTimeout(boot, 0); });
boot();
</script>
</body>
