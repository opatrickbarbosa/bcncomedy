<style>
@font-face{font-family:"Panton Rust";src:url(assets/PantonRustHeavy-GrSh.woff) format("woff");font-weight:400 900;font-display:swap}
@font-face{font-family:"Panton Script";src:url(assets/PantonRustScrSmBold-Gr.woff) format("woff");font-weight:400 900;font-display:swap}
:root{
  --ink:#070909; --ink-2:#111414; --card:#131717; --line:#2a2f2f;
  --paper:#f4f1e6; --muted:#b9b6aa; --dim:#8a877d;
  --sun:#ECC122; --sun-ink:#14120a; --lime:#E6FB94; --red:#DF260E; --sky:#6EE6FF;
  --display:"Panton Rust","Arial Black",Impact,system-ui,sans-serif;
  --script:"Panton Script","Brush Script MT",cursive;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{background:var(--ink);color:var(--paper);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url(assets/grunge.webp) center/cover;opacity:.55}
img{max-width:100%;display:block}
a{color:inherit}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.02;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
p{margin:0}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}
.eyebrow{font-family:var(--script);color:var(--red);font-size:1.45rem;line-height:1;margin-bottom:8px}
.tnum{font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--sun);color:var(--sun-ink);padding:10px 14px;border-radius:8px}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(7,9,9,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08);transition:background .3s,border-color .3s}
body.home.at-top .top:not(.open){background:transparent;border-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
body.home .top{position:fixed;left:0;right:0}
.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px}
.brand img{height:40px;width:auto}
.nav{display:flex;flex:1;justify-content:flex-end;gap:2px}
.nav a{text-decoration:none;font-weight:600;font-size:.95rem;padding:8px 12px;border-radius:999px;color:#dcd9cd;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a[aria-current="page"]{color:var(--sun)}
.menu-btn,.nav-close{display:none}
@media (max-width:900px){
  .brand img{height:32px}
  .top .cta{margin-left:auto}
  .menu-btn{display:grid;place-items:center;width:48px;height:48px;border:0;background:none;color:#fff;cursor:pointer}
  .menu-btn span,.menu-btn span::before,.menu-btn span::after{display:block;width:20px;height:2px;background:currentColor;position:relative;transition:transform .25s,background .25s}
  .menu-btn span::before,.menu-btn span::after{content:"";position:absolute;left:0}
  .menu-btn span::before{top:-7px}.menu-btn span::after{top:7px}
  .top.open .menu-btn span{background:transparent}
  .top.open .menu-btn span::before{transform:translateY(7px) rotate(45deg)}
  .top.open .menu-btn span::after{transform:translateY(-7px) rotate(-45deg)}
  .nav{position:fixed;left:0;right:0;top:var(--menu-top,62px);bottom:0;flex-direction:column;justify-content:flex-start;gap:0;background:var(--ink);padding:16px 20px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .25s,transform .25s,visibility 0s linear .25s}
  .top.open .nav{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .25s}
  .nav a{font-family:var(--display);font-size:2rem;text-transform:uppercase;padding:12px 2px;border-radius:0;border-bottom:1px solid var(--line)}
  .nav-close{display:block;margin-top:20px;min-height:54px;border:0;border-radius:999px;background:var(--sun);color:var(--sun-ink);font:800 1.05rem var(--body);cursor:pointer}
  body.menu-open{overflow:hidden}
}
/* language */
.ldd{position:relative}
.ldd summary{list-style:none;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.9rem;color:#dcd9cd;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.ldd summary::-webkit-details-marker{display:none}
.ldd svg{width:18px;height:18px}
.ldd-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:170px;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:40;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.ldd.up .ldd-menu{top:auto;bottom:calc(100% + 6px)}
.ldd-menu button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--paper);font:500 .95rem var(--body);padding:10px 12px;border-radius:8px;cursor:pointer}
.ldd-menu button b{width:24px;color:var(--sun)}
.ldd-menu button:hover,.ldd-menu button[aria-current="true"]{background:rgba(255,255,255,.07)}
@media (max-width:520px){.top .ldd summary span{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;border:0;font:800 1rem/1 var(--body);cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(1px)}
.btn-sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 4px 0 #9c7e10}
.btn-sun:hover{transform:translateY(-1px);box-shadow:0 5px 0 #9c7e10}
.btn-line{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.btn-line:hover{box-shadow:inset 0 0 0 2px var(--paper)}
.btn-sm{min-height:46px;padding:0 18px;font-size:.95rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* hero */
.hero{position:relative;min-height:min(100svh,940px);display:flex;align-items:center;padding:120px 0 72px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 55% at 28% 45%,rgba(236,193,34,.10),transparent 70%),radial-gradient(40% 40% at 85% 70%,rgba(223,38,14,.12),transparent 70%)}
.hero .wrap{position:relative;display:flex;justify-content:center;width:100%}
.hero-copy{text-align:center;max-width:760px}
.hero .presents,.hero .hero-facts,.hero .hero-ctas{justify-content:center}
.presents{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--muted);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem}
.presents img{height:46px;width:auto}
.hero-logo{margin:0 auto;width:min(560px,100%);height:auto;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.hero-tag{font-family:var(--script);color:var(--lime);font-size:clamp(1.35rem,2.6vw,1.8rem);line-height:1.15;margin:18px 0 14px}
.hero-facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-weight:600;font-size:.9rem}
.chip svg{width:16px;height:16px;color:var(--sun)}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hero-next{margin-top:16px;color:var(--muted);font-size:.95rem}
.hero-next b{color:var(--paper)}
@media (max-width:900px){
  .hero{min-height:0;padding:88px 0 40px}
  .presents,.hero-facts,.hero-ctas{justify-content:center}
  .hero-logo{margin:0 auto;width:min(420px,92%)}
      }

/* ticker */
.ticker{background:var(--sun);color:var(--sun-ink);overflow:hidden;border-block:3px solid var(--ink);transform:rotate(-1.2deg);margin:0 -10px;position:relative;z-index:2}
.ticker-track{display:flex;width:max-content;animation:tick 32s linear infinite}
.ticker span{font-family:var(--display);text-transform:uppercase;font-size:1.25rem;padding:12px 18px;white-space:nowrap}
.ticker span::after{content:"★";margin-left:36px;color:var(--red)}
@keyframes tick{to{transform:translateX(-50%)}}

/* sections */
.section{padding:84px 0}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.section-head h2{font-size:clamp(2.1rem,5vw,3.4rem)}
.section-head p.lead{color:var(--muted);max-width:560px;margin-top:10px}
.link-more{font-weight:700;text-decoration:none;color:var(--sun)}
.link-more:hover{text-decoration:underline}

/* stamp frame (from the retro banner) */
.stamp{padding:10px;border-radius:6px;background:radial-gradient(circle,var(--sun) 2.4px,transparent 2.9px) 0 0/13px 13px,var(--red)}
.stamp>.in{background:var(--ink);border-radius:2px}

/* show cards */
.shows{display:grid;gap:14px}
.show{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;background:rgba(19,23,23,.88);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;transition:border-color .2s,transform .2s}
.show:hover{border-color:rgba(236,193,34,.5)}
.date{display:grid;place-items:center;width:84px;height:92px;border-radius:10px;background:var(--sun);color:var(--sun-ink);text-align:center;line-height:1;box-shadow:4px 4px 0 var(--red)}
.date .wd{font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.date .d{font-family:var(--display);font-size:2.4rem}
.date .m{font-weight:800;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}
.show h3{font-size:1.35rem;margin:6px 0 4px}
.show-meta{color:var(--muted);font-size:.95rem}
.show-meta b{color:var(--paper)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:800;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.08);color:var(--paper)}
.badge.hot{background:var(--red);color:#fff}
.badge.lime{background:var(--lime);color:var(--ink)}
.badge.sky{background:var(--sky);color:var(--ink)}
@media (max-width:640px){
  .show{grid-template-columns:auto 1fr;gap:14px;padding:14px}
  .show-act{grid-column:1/-1}
  .show-act .btn{width:100%}
  .date{width:70px;height:80px}.date .d{font-size:2rem}
  .show h3{font-size:1.1rem}
}
/* ticket states */
.btn-hot{background:var(--red);color:#fff;box-shadow:0 4px 0 #8a1606;animation:pulse 1.6s ease-in-out infinite}
.btn-hot:hover{transform:translateY(-1px);box-shadow:0 5px 0 #8a1606}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 #8a1606,0 0 0 0 rgba(223,38,14,.55)}50%{box-shadow:0 4px 0 #8a1606,0 0 0 10px rgba(223,38,14,0)}}
.btn-soon{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line);cursor:default}
.btn-out{background:#2a2f2f;color:var(--dim);cursor:not-allowed}
.show.is-soon .date{background:#2a2f2f;color:var(--muted);box-shadow:4px 4px 0 #1b1f1f}
.show.is-hot{border-color:rgba(223,38,14,.6)}
.badge.soon{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.btn-hot{animation:none}}
.break{display:flex;gap:14px;align-items:center;padding:18px;border-radius:var(--r);border:2px dashed rgba(110,230,255,.45);color:var(--sky);font-weight:600}
.break svg{width:28px;height:28px;flex:none}
.break b{color:var(--paper)}
.empty{padding:28px;border-radius:var(--r);border:1px dashed var(--line);color:var(--muted);text-align:center}

/* month tabs */
.mtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:20px;padding-bottom:4px}
.mtabs::-webkit-scrollbar{display:none}
.mtab{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:rgba(19,23,23,.8);color:var(--paper);font:700 .95rem var(--body);cursor:pointer}
.mtab[aria-selected="true"]{background:var(--sun);color:var(--sun-ink);border-color:var(--sun)}


/* show feature */
.feature{display:grid;grid-template-columns:.9fr 1.1fr;gap:44px;align-items:center}
.feature .stamp{transform:rotate(-2deg);max-width:440px;width:100%}
.feature .stamp img{width:100%;height:auto}
.feature h2{font-size:clamp(2rem,4.6vw,3.2rem);margin-bottom:16px}
.feature p{color:#d9d6ca;margin-bottom:14px;max-width:560px}
.quote{font-family:var(--script);font-size:1.6rem;color:var(--lime);line-height:1.2;margin:6px 0 18px}
.ticks{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:8px}
.ticks li{display:flex;gap:10px;align-items:flex-start}
.ticks li::before{content:"★";color:var(--sun);flex:none}
@media (max-width:860px){.feature{grid-template-columns:1fr}.feature .stamp{margin:0 auto}}

/* comedians */
.cast{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.pcard{position:relative;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);display:grid;grid-template-rows:auto 1fr}
.pc-img{aspect-ratio:4/4.2;overflow:hidden;background:#000}
.pc-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.pcard:hover .pc-img img{transform:scale(1.04)}
.pc-ph{width:100%;height:100%;display:grid;place-items:center;background:url(assets/grunge.webp) center/cover,#000;text-align:center}
.pc-ph span{font-family:var(--display);font-size:clamp(4rem,12vw,7rem);color:var(--paper);text-shadow:5px 5px 0 var(--sun)}
.pc-body{padding:20px 20px 22px}
.pc-flag{font-weight:800;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sun)}
.pcard h3{font-size:1.7rem;margin:6px 0 10px}
.pcard p{color:#d0cdc1;font-size:.97rem}
.socials{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.soc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:var(--sun-ink);transition:transform .15s}
.soc:hover{transform:translateY(-2px)}
.soc svg{width:20px;height:20px}
@media (max-width:700px){.cast{grid-template-columns:1fr}}


/* venue */
.venue{display:grid;grid-template-columns:1fr 1.3fr;gap:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--card)}
.venue-txt{padding:32px}
.venue-txt h3{font-size:2rem;margin-bottom:10px}
.venue-txt p{color:var(--muted);margin-bottom:6px}
.venue-txt .btn{margin-top:18px}
.venue-media{display:grid;grid-template-rows:1.4fr 1fr;min-height:520px}
.venue-media figure{margin:0;position:relative;min-height:0}
.venue-media .photo img{width:100%;height:100%;object-fit:cover;display:block}
.venue-media.no-photo{grid-template-rows:1fr}
.venue-media iframe{width:100%;height:100%;border:0;display:block}
.venue-media .map{filter:grayscale(1) invert(.92) contrast(.9)}
.venue-media figcaption{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:999px;background:rgba(7,9,9,.8);font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
@media (max-width:760px){.venue{grid-template-columns:1fr}.venue-media{min-height:560px}}

/* hub / about */
.hub{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center}
.hub img{width:min(320px,70vw);height:auto}
.hub p{color:#d9d6ca;max-width:640px;margin-bottom:12px}
@media (max-width:760px){.hub{grid-template-columns:1fr;text-align:center}.hub img{margin:0 auto}.hub p{margin-inline:auto}}

/* page hero */
.phero{padding:120px 0 34px;position:relative}
.phero h1{font-size:clamp(2.6rem,7vw,4.8rem)}
.phero h1 em{font-style:normal;color:var(--sun)}
.phero p{color:var(--muted);max-width:620px;margin-top:12px;font-size:1.05rem}

/* forms */
.form{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:6px;font-weight:600;font-size:.92rem}
input,select,textarea{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:#0c0f0f;color:var(--paper);font:500 1rem var(--body);padding:12px 14px}
textarea{min-height:130px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sun);box-shadow:0 0 0 3px rgba(236,193,34,.25)}
.ok-line{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--muted)}
.ok-line input{width:20px;min-height:20px;height:20px;margin-top:2px;accent-color:var(--sun)}
.err{color:#ff7a66;font-weight:600;font-size:.92rem}
.done{padding:22px;border-radius:var(--r);background:rgba(230,251,148,.1);border:1px solid rgba(230,251,148,.4);color:var(--lime);font-weight:600}
.panel{background:rgba(19,23,23,.9);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.alerts{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;align-items:center}
.alerts h3{font-size:clamp(1.6rem,3.6vw,2.3rem)}
.alerts p{color:var(--muted);margin-top:8px}
.vm-row{display:grid;grid-template-columns:1fr 1.3fr auto;gap:10px}
@media (max-width:860px){.alerts{grid-template-columns:1fr}.vm-row{grid-template-columns:1fr}}
.formats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:40px}
.fmt{padding:22px;border-radius:var(--r);background:rgba(19,23,23,.88);border:1px solid var(--line)}
.fmt .k{font-family:var(--display);color:var(--sun);font-size:1.5rem;text-transform:uppercase}
.fmt h3{font-size:1.1rem;margin:8px 0;font-family:var(--body);font-weight:800;text-transform:none}
.fmt p{color:var(--muted);font-size:.95rem}
@media (max-width:900px){.formats{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.formats{grid-template-columns:1fr}}
.contact-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:28px}
.contact-grid .panel h3{font-size:1.5rem;margin-bottom:10px}
.contact-grid .panel p{color:var(--muted)}
@media (max-width:820px){.contact-grid{grid-template-columns:1fr}}
.prose{max-width:760px}
.prose h2{font-size:1.5rem;margin:28px 0 8px}
.prose p{color:#d0cdc1;margin-bottom:10px}

/* footer (centred, like brasileuros.com) */
.foot{margin-top:40px;border-top:1px solid var(--line);background:radial-gradient(120% 80% at 50% 0%,#1a1c12 0%,#0b0d0d 55%,#070909 100%);color:#d6d3c7}
.foot-in{max-width:880px;margin:0 auto;padding:64px max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;justify-items:center;gap:26px;text-align:center}
.foot-logo{width:min(260px,62%);height:auto;filter:drop-shadow(0 0 24px rgba(236,193,34,.25))}
.foot-about{color:var(--muted);font-size:.95rem;max-width:520px}
.foot-mail{color:var(--sun);text-decoration:none;font-weight:700}
.foot-soc .socials{margin:0;justify-content:center}
.foot-links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 20px;font-size:.85rem}
.foot-links a{color:#b9b6aa;text-decoration:none;padding:4px 0}
.foot-links a:hover{color:var(--sun)}
.foot-real{display:grid;justify-items:center;gap:10px}
.foot-real small{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.partners{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px 28px}
.partners img{height:40px;width:auto;opacity:.9}
.partners .pt{font-family:var(--display);font-size:1.15rem;text-transform:uppercase;color:#d6d3c7}
.foot-venue{color:var(--dim);font-size:.85rem}
.foot-copy{color:var(--dim);font-size:.8rem}

/* links page */
.links-page{min-height:100svh;padding:40px 18px 60px;display:flex;justify-content:center}
.lw{width:100%;max-width:460px;display:grid;gap:12px;align-content:start;text-align:center}
.lw .lasc{width:78%;margin:6px auto 0}
.lw .sub{color:var(--muted);margin-bottom:8px}
.lbtn{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:14px;background:rgba(19,23,23,.9);border:1px solid var(--line);text-decoration:none;font-weight:700}
.lbtn:hover{border-color:var(--sun)}
.next{text-align:left}
.next .in{padding:18px}
.next .when{font-family:var(--display);font-size:1.6rem;text-transform:uppercase;color:var(--sun);line-height:1.1;margin:4px 0}
.next .where{color:var(--muted);margin-bottom:14px}
.next .btn{width:100%}
.lw .socials{justify-content:center}
.lw .ldd{margin:8px auto 0}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}

@media (prefers-reduced-motion:reduce){.ticker-track{animation:none}.reveal{opacity:1;transform:none;transition:none}*{scroll-behavior:auto!important}}

/* ---------- routing (clean URLs on bcncomedy.com/vercel, hash elsewhere) ---------- */
const ROUTES=["","agenda","show","comedians","book","contact","privacy","links"];
const CLEAN=/(^|\.)bcncomedy\.com$|\.vercel\.app$/.test(location.hostname);
function curRoute(){
  if(location.hash.length>1){const h=decodeURIComponent(location.hash.slice(1));if(ROUTES.includes(h)||!CLEAN)return h}
  return CLEAN?decodeURIComponent(location.pathname).replace(/^\/|\/$/g,"").replace(/^index\.html$/,""):"";
}
const href=r=>CLEAN?"/"+r:"#"+r;
function go(r){if(CLEAN){history.pushState({},"","/"+r)}else{if(location.hash==="#"+r){render();return}location.hash=r;return}render()}
document.addEventListener("click",e=>{
  const a=e.target.closest("a[data-r]");if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
  e.preventDefault();go(a.dataset.r)});
addEventListener("popstate",render);addEventListener("hashchange",render);

const L=(r,label,cls)=>`<a href="${href(r)}" data-r="${r}"${cls?` class="${cls}"`:""}>${label}</a>`;
function badges(s){const out=[];const st=status(s);
  out.push(st==="tonight"?`<span class="badge hot">${t("tonightB")}</span>`:st==="last"?`<span class="badge hot">${t("lastB")}</span>`:st==="sold"?`<span class="badge">${t("soldB")}</span>`:st==="soon"?`<span class="badge soon">${t("soonB")}</span>`:`<span class="badge lime">${t("onsaleB")}</span>`);
  if(s.special)out.push(`<span class="badge ${s.special==="weekly"?"sky":"lime"}" style="${s.special==="weekly"?"":"background:var(--sun)"}">${t("sp")[s.special]}</span>`);
  out.push(`<span class="badge">${t("english")}</span>`);return out.join("")}
function buy(s,cls){const st=status(s);cls=cls||"";
  if(st==="sold")return `<span class="btn btn-out ${cls}" aria-disabled="true">${t("soldBtn")}</span>`;
  if(st==="soon")return `<span class="btn btn-soon ${cls}" aria-disabled="true">${t("soonBtn")(fmt({day:"numeric",month:"short"},opensOn(s)))}</span>`;
  const hot=st==="last"||st==="tonight";
  return `<a class="btn ${hot?"btn-hot":"btn-sun"} ${cls}" href="${esc(s.url)}" target="_blank" rel="noopener">${hot?t(st==="tonight"?"tonightBtn":"lastBtn"):t("buy")}</a>`}
function showCard(s){const d=dt(s);
  const st=status(s);
  return `<article class="show${st==="soon"?" is-soon":st==="last"||st==="tonight"?" is-hot":""}">
   <div class="date tnum" aria-label="${fmt({weekday:"long",day:"numeric",month:"long"},d)}"><span class="wd">${fmt({weekday:"short"},d)}</span><span class="d">${d.getDate()}</span><span class="m">${fmt({month:"short"},d)}</span></div>
   <div><div class="badges">${badges(s)}</div><h3>Laughin American Social Club</h3>
   <div class="show-meta tnum"><b>${hour(s)}</b> · ${SITE.VENUE.name}, Gràcia</div></div>
   <div class="show-act">${buy(s,"btn-sm")}</div></article>`}
function showList(list){return list.map(showCard).join("")}
function socials(S){return `<div class="socials">${Object.keys(S).map(k=>`<a class="soc" href="${S[k]}" target="_blank" rel="noopener" aria-label="${k}">${ICON[k]}</a>`).join("")}</div>`}

  return phero(t("showH"),t("tag"))+`<section class="section" style="padding-top:10px"><div class="wrap feature">
   <div class="stamp"><div class="in"><img src="assets/retro-banner.webp" alt="Laughin American Social Club" width="1600" height="1126"></div></div>
   <div>${t("showP").map(p=>`<p>${p}</p>`).join("")}<ul class="ticks">${t("showList").map(x=>`<li>${x}</li>`).join("")}</ul>
   <div class="hero-ctas">${next?buy(next):""}${L("agenda",t("allDates"),"btn btn-line")}</div></div></div></section>
   <section class="section" style="padding-top:20px"><div class="wrap"><div class="section-head"><div><p class="eyebrow">${t("onStage")}</p><h2>${t("nextShows")}</h2></div>${L("agenda",t("fullAgenda"),"link-more")}</div>
   <div class="shows">${showList(upcoming().slice(0,3))}</div></div></section>

function pCast(){return phero(t("castH"),t("castP"))+`<section class="section" style="padding-top:20px"><div class="wrap"><div class="cast">${COMEDIANS.map(pcard).join("")}</div></div></section>${alertsBlock()}`}
function pBook(){const F=t("F");
  return phero(t("bizH"),t("bizP"))+`<section class="section" style="padding-top:20px"><div class="wrap">
   <div class="formats">${F.map(([k,h,p])=>`<div class="fmt"><div class="k">${k}</div><h3>${h}</h3><p>${p}</p></div>`).join("")}</div>

   <form class="form" data-form="book" novalidate style="position:relative"><input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <div class="grid2"><label class="f">${t("name")}<input name="name" autocomplete="name" required></label><label class="f">${t("email")}<input name="email" type="email" autocomplete="email" required></label></div>
    <div class="grid2"><label class="f">${t("company")}<input name="company" autocomplete="organization"></label><label class="f">${t("phone")}<input name="phone" type="tel" autocomplete="tel"></label></div>
    <div class="grid2"><label class="f">${t("evDate")}<input name="date" type="date"></label><label class="f">${t("guests")}<input name="guests" inputmode="numeric"></label></div>
    <div class="grid2"><label class="f">${t("format")}<select name="format">${F.map(f=>`<option>${f[1]}</option>`).join("")}</select></label><label class="f">${t("lang2")}<select name="language">${t("langs").map(x=>`<option>${x}</option>`).join("")}</select></label></div>
    <label class="f">${t("msg")}<textarea name="message" required></textarea></label>
    <p class="err" hidden></p><div><button class="btn btn-sun" type="submit">${t("send")}</button></div>
   </form></div></div></section>`}
function pContact(){const S=t("contactSide");
  return phero(t("contactH"),t("contactP"))+`<section class="section" style="padding-top:20px"><div class="wrap contact-grid">
   <div style="display:grid;gap:14px;align-content:start">
    <div class="panel"><h3>${S[0][0]}</h3><p>${S[0][1]}</p>${socials({instagram:SITE.INSTAGRAM})}</div>
    <div class="panel"><h3>${t("emailT")}</h3><p>${t("emailP")}</p><p style="margin-top:8px"><a href="mailto:${SITE.EMAIL}" style="color:var(--sun);font-weight:700">${SITE.EMAIL}</a></p></div>
    <div class="panel"><h3>${S[1][0]}</h3><p>${S[1][1]}</p></div>
   </div>
   <div class="panel"><form class="form" data-form="contact" novalidate style="position:relative"><input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    <div class="grid2"><label class="f">${t("name")}<input name="name" autocomplete="name" required></label><label class="f">${t("email")}<input name="email" type="email" autocomplete="email" required></label></div>
    <label class="f">${t("message")}<textarea name="message" required></textarea></label>
    <p class="err" hidden></p><div><button class="btn btn-sun" type="submit">${t("send")}</button></div>
   </form></div></div></section>`}
function pPriv(){return phero(t("privH"))+`<section class="section" style="padding-top:10px"><div class="wrap prose">${t("privP").map(p=>`<p>${p}</p>`).join("")}</div></section>`}
function p404(){return phero("404",t("notFound"))+`<section class="section" style="padding-top:0"><div class="wrap">${L("",t("home"),"btn btn-sun")}</div></section>`}
function pLinks(){const next=upcoming()[0],nd=next?dt(next):null;
  return `<div class="links-page"><div class="lw">
   <img src="assets/bcn-logo-s.webp" alt="BCN Comedy" style="width:120px;margin:0 auto">
   <img class="lasc" src="assets/lasc-logo.webp" alt="Laughin American Social Club">
   <p class="sub">${t("linksSub")}</p>
   ${next?`<div class="stamp next"><div class="in"><p class="eyebrow">${t("nextShow")}</p><p class="when tnum">${fmt({weekday:"long",day:"numeric",month:"long"},nd)} · ${hour(next)}</p><p class="where">${SITE.VENUE.name} · ${SITE.VENUE.addr}, Gràcia</p>${buy(next)}</div></div>`:""}
   ${L("agenda",t("allDatesBtn"),"lbtn")}${L("book",t("bizBtn"),"lbtn")}${L("comedians",t("castBtn"),"lbtn")}
   <div class="panel" style="text-align:left"><p style="font-weight:700;margin-bottom:10px">${t("alertsH")}</p>${alertsForm("links")}</div>
   ${socials({instagram:SITE.INSTAGRAM})}${langSwitch()}
  </div></div>`}

/* ---------- forms ---------- */
async function sendForm(type,data){
  if(!SITE.FORM_URL)throw new Error("no endpoint");
  const nx=upcoming().find(x=>{const st=status(x);return st!=="soon"&&st!=="sold"});
  const payload={type,lang:LANG,...data};
  if(nx){payload.nextShow=fmt({weekday:"long",day:"numeric",month:"long"},dt(nx))+" · "+hour(nx);payload.nextUrl=nx.url}
  const r=await fetch(SITE.FORM_URL,{method:"POST",body:JSON.stringify(payload)});
  const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error("send");return j}
const okMail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
function wireForms(){
  document.querySelectorAll("form[data-alert]").forEach(f=>f.addEventListener("submit",async e=>{e.preventDefault();
    const err=f.querySelector(".err"),btn=f.querySelector("button[type=submit]");const fd=Object.fromEntries(new FormData(f));
    if(!okMail(fd.email||"")){err.textContent=t("errMail");err.hidden=false;return}
    if(!f.ok.checked){err.textContent=t("errOk");err.hidden=false;return}
    err.hidden=true;btn.disabled=true;btn.textContent=t("sending");
    try{await sendForm("alerts",{name:fd.name||"",email:fd.email,source:f.dataset.alert,website:fd.website||""});f.outerHTML=`<div class="done">${t("alertDone")}</div>`}
    catch(_){err.textContent=t("sendFail");err.hidden=false;btn.disabled=false;btn.textContent=t("notify")}}));
  document.querySelectorAll("form[data-form]").forEach(f=>f.addEventListener("submit",async e=>{e.preventDefault();
    const err=f.querySelector(".err"),btn=f.querySelector("button[type=submit]");const fd=Object.fromEntries(new FormData(f));
    if(!fd.name||!okMail(fd.email||"")||!fd.message){err.textContent=t("errReq");err.hidden=false;return}
    err.hidden=true;btn.disabled=true;btn.textContent=t("sending");const book=f.dataset.form==="book";
    try{await sendForm(book?"book":"contact",fd);f.outerHTML=`<div class="done">${t(book?"bizDone":"contactDone")}</div>`}
    catch(_){err.textContent=t("sendFail");err.hidden=false;btn.disabled=false;btn.textContent=t("send")}}));
}

/* ---------- SEO: events ---------- */
function eventsLD(){let el=document.getElementById("ld-events");if(!el){el=document.createElement("script");el.type="application/ld+json";el.id="ld-events";document.head.appendChild(el)}
  const V=SITE.VENUE;el.textContent=JSON.stringify({"@context":"https://schema.org","@graph":upcoming().slice(0,8).map(s=>({"@type":"ComedyEvent","name":"Laughin American Social Club · Stand-up Comedy in English","startDate":s.data+"T20:30:00+01:00","eventStatus":"https://schema.org/EventScheduled","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","inLanguage":"en","image":"https://www.bcncomedy.com/assets/og.jpg","location":{"@type":"Place","name":V.name,"address":{"@type":"PostalAddress","streetAddress":V.addr,"addressLocality":"Barcelona","postalCode":"08012","addressCountry":"ES"}},"performer":COMEDIANS.map(c=>({"@type":"Person","name":c.name})),"organizer":{"@type":"Organization","name":"BCN Comedy","url":"https://www.bcncomedy.com/"},"offers":{"@type":"Offer","url":s.url,"availability":status(s)==="sold"?"https://schema.org/SoldOut":status(s)==="soon"?"https://schema.org/PreOrder":"https://schema.org/InStock","validFrom":ymd(opensOn(s))}}))})}

/* ---------- render ---------- */
const TITLES={agenda:0,show:1,comedians:2,book:3,contact:4,privacy:5};
function render(){
  const r=curRoute();document.documentElement.lang=LOCALE[LANG];document.body.classList.remove("menu-open");
  const app=document.getElementById("app");
  document.body.classList.toggle("home",r==="");
  if(r==="links"){app.innerHTML=pLinks()}
  else{
    const body=r===""?pHome():r==="agenda"?pAgenda():r==="show"?pShow():r==="comedians"?pCast():r==="book"?pBook():r==="contact"?pContact():r==="privacy"?pPriv():p404();
    app.innerHTML=header(r)+`<main id="main">${body}</main>`+footer();
  }
  document.title=(r&&TITLES[r]!==undefined?t("foot")[TITLES[r]]+" · ":"")+"BCN Comedy · Laughin American Social Club";
  scrollTo(0,0);wire();wireForms();onScroll();eventsLD();
}
function wire(){
  const top=document.querySelector(".top"),mb=document.querySelector(".menu-btn");
  const close=()=>{top&&top.classList.remove("open");document.body.classList.remove("menu-open");mb&&mb.setAttribute("aria-expanded","false")};
  if(mb)mb.onclick=()=>{const o=!top.classList.contains("open");top.classList.toggle("open",o);document.body.classList.toggle("menu-open",o);mb.setAttribute("aria-expanded",o);document.documentElement.style.setProperty("--menu-top",top.getBoundingClientRect().bottom+"px")};
  document.querySelectorAll(".nav a,.nav-close").forEach(a=>a.addEventListener("click",close));
  document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;try{localStorage.setItem("bcn-lang",LANG)}catch(_){}render()});
  document.querySelectorAll("[data-mtab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-mtab]").forEach(x=>x.setAttribute("aria-selected",x===b));document.querySelectorAll("[data-mpanel]").forEach(p=>p.hidden=p.dataset.mpanel!==b.dataset.mtab)});
  const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in-view");io.unobserve(e.target)}}),{threshold:.12}):null;
  document.querySelectorAll(".reveal").forEach(el=>io?io.observe(el):el.classList.add("in-view"));
}
function onScroll(){document.body.classList.toggle("at-top",scrollY<40)}
addEventListener("scroll",onScroll,{passive:true});
document.addEventListener("click",e=>{document.querySelectorAll("details.ldd[open]").forEach(d=>{if(!d.contains(e.target))d.removeAttribute("open")})});
render();
</script>
